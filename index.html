<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>City Life RP — Safari Fix</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080b0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none}
#game{position:fixed;inset:0;background:#111820}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;pointer-events:none}
.card{background:linear-gradient(180deg,#121923ed,#0b1016e8);border:1px solid #ffffff18;border-radius:14px;padding:7px 9px;box-shadow:0 8px 25px #0008;font-size:11px}
.card b{font-size:13px}
.bar{height:4px;background:#ffffff12;border-radius:8px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0;background:#6dd5ff}
#topBtns{position:fixed;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.iconBtn{width:42px;height:42px;border-radius:13px;background:#0d141de8;border:1px solid #ffffff18;color:#fff;font-size:18px}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 10px;pointer-events:none}
#joy{width:112px;height:112px;border-radius:50%;background:#ffffff0e;border:2px solid #ffffff1c;position:relative;pointer-events:auto;box-shadow:0 10px 30px #0007}
#stick{position:absolute;width:48px;height:48px;left:30px;top:30px;border-radius:50%;background:#ffffff28;border:1px solid #ffffff38}
.actions{display:grid;grid-template-columns:repeat(3,54px);gap:6px;pointer-events:auto}
button{width:54px;height:54px;border:1px solid #ffffff22;border-radius:15px;background:#0d141de8;color:#fff;font-weight:800;font-size:10px;box-shadow:0 8px 18px #0007}
button:active{transform:scale(.95);background:#27313d}
.primary{background:#255f87}.gold{background:#70551f}.green{background:#275d42}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:132px;background:#0d141de8;border:1px solid #ffffff20;border-radius:12px;padding:8px 12px;font-size:11px;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:75px;transform:translateX(-50%);background:#101720f2;padding:9px 13px;border-radius:12px;display:none;border:1px solid #ffffff1c;z-index:10;font-size:12px}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,460px);max-height:84vh;overflow:auto;background:#0c1219f8;border:1px solid #ffffff1c;border-radius:22px;padding:16px;display:none;box-shadow:0 25px 70px #000b;z-index:20}
#panel h2{margin:0 0 5px;font-size:21px}.sub{opacity:.66;font-size:11px;line-height:1.4;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #ffffff10;padding:10px 0}.row b{font-size:13px}.small{opacity:.65;font-size:10px;line-height:1.35}
.buy,.close{width:auto;height:38px;padding:0 12px;border-radius:11px;border:0}.buy{background:#286e4b}.close{background:#303a46}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{padding:12px;border:1px solid #ffffff12;background:#111923;border-radius:15px}.tile button{width:100%;height:42px;margin-top:7px}
input,select{width:100%;background:#0a1016;border:1px solid #ffffff18;color:#fff;border-radius:10px;padding:9px}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:11px}
.badge{display:inline-block;padding:3px 6px;border-radius:7px;background:#ffffff10;font-size:9px;margin-left:4px}

#chat{position:fixed;left:8px;right:8px;bottom:132px;height:155px;background:#091018e8;border:1px solid #ffffff18;border-radius:16px;padding:8px;display:none;z-index:12;box-shadow:0 15px 40px #0009}
#chatlog{height:108px;overflow:auto;font-size:11px;line-height:1.45;padding:2px 4px}.chatline{margin:2px 0}.sys{opacity:.65}.admin{color:#ffd86b}.cmd{color:#8fd5ff}
#chatbar{display:flex;gap:6px;margin-top:5px}.chatinput{flex:1;min-width:0;height:36px!important;width:auto!important;padding:0 10px!important;border-radius:10px!important;background:#0e1720!important;color:#fff!important;border:1px solid #ffffff18!important}
#chatSend{width:64px!important;height:36px!important}
#adminBadge{display:none;position:fixed;top:78px;right:10px;background:#7b5b16;color:#fff;padding:5px 8px;border-radius:9px;font-size:9px;z-index:11}
</style>
<style>
/* City Life RP — Landscape HD visual pass */
:root{
  --hud-bg: rgba(7,12,20,.82);
  --hud-border: rgba(255,255,255,.14);
  --glass: rgba(14,20,31,.72);
  --accent: #55c7ff;
}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071018}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game,canvas{width:100vw!important;height:100vh!important;display:block}
@media (orientation: landscape){
  #game, .game, .app, #app{min-width:100vw;min-height:100vh}
}
.hud,.topbar,.panel,.modal,.chat,.inventory,.garage,.shop{
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hud-border);
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}
button{
  border-radius:12px!important;
  border:1px solid rgba(255,255,255,.15)!important;
  box-shadow:0 5px 16px rgba(0,0,0,.22);
}
</style><style>
/* Safari-safe visual map fallback: the game remains playable even when canvas rendering is unavailable. */
#mapFallback{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(circle at 50% 45%,rgba(54,86,64,.35),transparent 32%),
 linear-gradient(90deg,#182b20 0 18%,#1b3024 18% 34%,#17281f 34% 55%,#1c3125 55% 76%,#182a20 76%);
 z-index:1;pointer-events:none}
#c{position:absolute;inset:0;z-index:0;opacity:0!important}
.cityRoad{position:absolute;background:#30383d;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);z-index:2}
.cityRoad:after{content:"";position:absolute;background:repeating-linear-gradient(90deg,#e1cb72 0 24px,transparent 24px 48px);opacity:.65}
.cityRoad.v{top:0;bottom:0;width:70px}.cityRoad.v:after{top:0;bottom:0;width:3px;left:34px;background:repeating-linear-gradient(0deg,#e1cb72 0 24px,transparent 24px 48px)}
.cityRoad.h{left:0;right:0;height:70px}.cityRoad.h:after{left:0;right:0;height:3px;top:34px}
.r1{left:12%}.r2{left:34%}.r3{left:57%}.r4{left:81%}
.r5{top:20%}.r6{top:42%}.r7{top:65%}.r8{top:86%}
.cityBuilding{position:absolute;width:11%;height:13%;background:linear-gradient(135deg,#34434b,#202a31);border:2px solid #46555c;border-radius:10px;box-shadow:0 8px 18px #0006;z-index:3}
.cityBuilding:after{content:"";position:absolute;inset:10px;background:repeating-linear-gradient(90deg,#71858e 0 7px,transparent 7px 17px);opacity:.55;border-radius:5px}
.b1{left:3%;top:3%}.b2{left:19%;top:4%}.b3{left:40%;top:3%}.b4{left:63%;top:4%}
.b5{left:86%;top:5%}.b6{left:4%;top:28%}.b7{left:19%;top:28%}.b8{left:40%;top:28%}
.b9{left:63%;top:28%}.b10{left:86%;top:29%}.b11{left:19%;top:72%}.b12{left:63%;top:72%}
.park{position:absolute;width:12%;height:12%;display:flex;align-items:center;justify-content:center;background:#24583a;border:2px solid #34704b;border-radius:18px;font-size:24px;z-index:3;box-shadow:0 8px 20px #0005}
.p1{left:4%;top:49%}.p2{left:42%;top:50%}.p3{left:82%;top:53%}
#playerMarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1689e6;border:3px solid white;box-shadow:0 0 0 8px rgba(22,137,230,.22),0 5px 18px #0009;color:white;font-size:15px;z-index:8;transition:left .08s linear,top .08s linear}
#mapLabel{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:4px;font-size:clamp(16px,2.2vw,28px);opacity:.18;z-index:4;pointer-events:none}
#hud,#topBtns,#controls,#hint,#toast,#panel,#chat,#adminBadge{z-index:10}
</style></head>
<body>
<div id="game">
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="mapFallback" aria-label="Игровая карта">
    <div class="cityRoad v r1"></div><div class="cityRoad v r2"></div><div class="cityRoad v r3"></div><div class="cityRoad v r4"></div>
    <div class="cityRoad h r5"></div><div class="cityRoad h r6"></div><div class="cityRoad h r7"></div><div class="cityRoad h r8"></div>
    <div class="cityBuilding b1"></div><div class="cityBuilding b2"></div><div class="cityBuilding b3"></div><div class="cityBuilding b4"></div>
    <div class="cityBuilding b5"></div><div class="cityBuilding b6"></div><div class="cityBuilding b7"></div><div class="cityBuilding b8"></div>
    <div class="cityBuilding b9"></div><div class="cityBuilding b10"></div><div class="cityBuilding b11"></div><div class="cityBuilding b12"></div>
    <div class="park p1">🌳</div><div class="park p2">🌳</div><div class="park p3">🌳</div>
    <div id="playerMarker">●</div>
    <div id="mapLabel">CITY LIFE RP</div>
  </div>
</div>

<div id="hud">
  <div class="card">💰 <b id="money">50 000 ₽</b><div class="bar"><i id="xpbar"></i></div></div>
  <div class="card">⭐ Ур. <b id="level">1</b> · XP <b id="xp">0</b></div>
  <div class="card">🏠 <b id="props">0</b> · 🚗 <b id="cars">1</b></div>
  <div class="card">🎰 Фишки <b id="chips">1 000</b></div>
</div>
<div id="topBtns"><button class="iconBtn" id="chatBtn">💬</button><button class="iconBtn" id="mapBtn">🗺️</button><button class="iconBtn" id="menuBtn">☰</button></div>
<div id="hint"></div><div id="toast"></div>

<div id="adminBadge">ADMIN</div><div id="chat"><div id="chatlog"></div><div id="chatbar"><input id="chatInput" class="chatinput" autocomplete="off" placeholder="Сообщение или /help"><button id="chatSend">OK</button></div></div><div id="controls">
  <div id="joy"><div id="stick"></div></div>
  <div class="actions">
    <button id="act" class="primary">ДЕЙСТВИЕ</button>
    <button id="car">🚗<br>АВТО</button>
    <button id="tune" class="gold">🔧<br>ТЮНИНГ</button>
    <button id="auction">🔨<br>АУКЦИОН</button>
    <button id="casino">🎰<br>КАЗИНО</button>
    <button id="jobs" class="green">💼<br>РАБОТА</button>
  </div>
</div>
<div id="panel"></div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const world={w:5000,h:3600};
let p={x:2500,y:1800,ang:0,inCar:false};
let money=50000,chips=1000,level=1,xp=0,props=[],ownedBusiness=[],cars=[
 {name:'Lada Granta',price:35000,color:'#b8c1ca',power:100,turbo:0,engine:0,brakes:0,wheels:0,paint:0,vinyl:0}
],activeCar=0;
let cam={x:0,y:0};
const properties=[
{name:'Комната «Старт»',type:'Комната',price:18000,x:720,y:640},{name:'Студия «Центр»',type:'Квартира',price:90000,x:2050,y:1150},
{name:'2-комнатная «Север»',type:'Квартира',price:165000,x:3650,y:650},{name:'Семейный дом',type:'Дом',price:380000,x:900,y:2750},
{name:'Премиум-вилла',type:'Дом',price:950000,x:3850,y:2850},{name:'Гараж №7',type:'Гараж',price:75000,x:1450,y:3000},
{name:'Автосервис',type:'Бизнес',price:650000,x:3000,y:3000},{name:'Кофейня «Порт»',type:'Бизнес',price:480000,x:4150,y:1550},
{name:'Магазин 24/7',type:'Бизнес',price:720000,x:950,y:1500},{name:'Ночной клуб',type:'Бизнес',price:1250000,x:2700,y:700}
];
const models=[
['Lada Granta',35000,'#b8c1ca',100],['VAZ 2107',55000,'#bfc2c7',90],['Lada Vesta',170000,'#73879a',122],['Kia Rio',420000,'#8f4d55',123],
['Toyota Camry',950000,'#292e34',181],['BMW M5',2200000,'#4e5b68',625],['Mercedes E63',2800000,'#d4d6d8',612],
['Gelandewagen',3500000,'#202327',585],['Porsche 911',4200000,'#a43f3f',580],['Lamborghini Huracan',8500000,'#9aab40',640]
];
const auctionCars=[
{name:'BMW M4 Competition',price:3100000,color:'#6d7882',power:510,bid:2700000},{name:'Nissan GT-R',price:4800000,color:'#30343b',power:570,bid:3900000},
{name:'Toyota Supra',price:2700000,color:'#a4513d',power:387,bid:2200000},{name:'Audi RS7',price:5200000,color:'#7e8288',power:600,bid:4300000},
{name:'Mercedes AMG GT',price:6100000,color:'#555f68',power:585,bid:5100000}
];
const roads=[];for(let x=300;x<world.w;x+=600)roads.push({x,vert:true});for(let y=300;y<world.h;y+=520)roads.push({y,vert:false});
const buildings=[];for(let gx=0;gx<world.w;gx+=600)for(let gy=0;gy<world.h;gy+=520)buildings.push({x:gx+60,y:gy+60,w:480,h:390});
const npcs=[];for(let i=0;i<65;i++)npcs.push({x:250+Math.random()*4500,y:250+Math.random()*3100,a:Math.random()*6.28,t:Math.random()*10});
const traffic=[];for(let i=0;i<28;i++)traffic.push({x:300+Math.random()*4400,y:300+Math.random()*3000,a:Math.random()*6.28,s:1+Math.random()*2.2,color:['#d64c4c','#d5d8da','#3e6d9c','#b7a33f'][i%4]});

function moneyFmt(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function numFmt(n){return Math.round(n).toLocaleString('ru-RU')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
function updateHud(){moneyEl.textContent=moneyFmt(money);document.getElementById('props').textContent=props.length;document.getElementById('cars').textContent=cars.length;document.getElementById('level').textContent=level;document.getElementById('xp').textContent=xp;document.getElementById('chips').textContent=numFmt(chips);document.getElementById('xpbar').style.width=Math.min(100,xp/(level*100)*100)+'%'}
const moneyEl=document.getElementById('money');updateHud();

function nearestProp(){let best=null,bd=1e9;for(const q of properties){let d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return bd<170?best:null}
function addXP(n){xp+=n;while(xp>=level*100){xp-=level*100;level++;toast('Новый уровень: '+level)}updateHud()}
function buyProperty(q){if(props.includes(q.name)){toast('Уже куплено');return}if(money<q.price){toast('Не хватает денег');return}money-=q.price;props.push(q.name);if(q.type==='Бизнес')ownedBusiness.push(q.name);addXP(80);toast('Куплено: '+q.name)}
function buyModel(i){const [name,price,color,power]=models[i];if(money<price){toast('Не хватает денег');return}cars.push({name,price,color,power,turbo:0,engine:0,brakes:0,wheels:0,paint:0,vinyl:0});money-=price;activeCar=cars.length-1;addXP(60);toast('Куплена: '+name)}
function closePanel(){document.getElementById('panel').style.display='none'}
function panel(title,body){const el=document.getElementById('panel');el.innerHTML='<h2>'+title+'</h2>'+body+'<div style="margin-top:12px"><button class="close" onclick="closePanel()">Закрыть</button></div>';el.style.display='block'}
window.closePanel=closePanel;

function carPanel(){
let s='<div class="sub">Автосалон. Купленные машины доступны в гараже и для тюнинга.</div>';
models.forEach((q,i)=>s+=`<div class="row"><div><b>${q[0]}</b><div class="small">${moneyFmt(q[1])} · ${q[3]} л.с.</div></div><button class="buy" onclick="buyModel(${i})">Купить</button></div>`);
s+='<div class="row"><div><b>Активная машина</b><div class="small">'+cars[activeCar].name+'</div></div><button class="buy" onclick="garagePanel()">Гараж</button></div>';
panel('🚗 Автосалон',s)
}
window.buyModel=buyModel;

function garagePanel(){
let s='<div class="sub">Выбирай активную машину. Улучшения сохраняются отдельно для каждой.</div>';
cars.forEach((q,i)=>s+=`<div class="row"><div><b>${q.name}</b><div class="small">${q.power+q.turbo*35+q.engine*20} л.с. · тюнинг ${q.turbo+q.engine+q.brakes+q.wheels+q.paint+q.vinyl}/6</div></div><button class="buy" onclick="activeCar=${i};closePanel();toast('Выбрана: ${q.name}')">${activeCar===i?'Выбрана':'Выбрать'}</button></div>`);
panel('🏁 Гараж',s)
}
window.garagePanel=garagePanel;

const tuneItems=[
['turbo','Турбина',120000,'+35 л.с.'],['engine','Чип/двигатель',90000,'+20 л.с.'],['brakes','Спорт-тормоза',65000,'лучше торможение'],
['wheels','Легкосплавные диски',80000,'управляемость'],['paint','Покраска',45000,'новый цвет'],['vinyl','Винил',60000,'уникальный стиль']
];
function tunePanel(){
const q=cars[activeCar];let s=`<div class="sub"><b>${q.name}</b> · ${q.power+q.turbo*35+q.engine*20} л.с. · активный слот №${activeCar+1}</div><div class="grid2">`;
tuneItems.forEach(it=>{let lvl=q[it[0]];s+=`<div class="tile"><b>${it[1]}</b><div class="small">${it[3]}<br>Ур. ${lvl}/3 · ${moneyFmt(it[2])}</div><button class="buy" onclick="upgrade('${it[0]}',${it[2]})">${lvl>=3?'MAX':'Улучшить'}</button></div>`});s+='</div>';
panel('🔧 Тюнинг',s)
}
function upgrade(k,cost){let q=cars[activeCar];if(q[k]>=3){toast('Максимальный уровень');return}if(money<cost){toast('Не хватает денег');return}money-=cost;q[k]++;if(k==='paint'){q.color=['#b8c1ca','#b64b4b','#4d79b8','#c6a53b'][q[k]]||'#d8d8d8'}addXP(20);toast('Улучшено: '+k);tunePanel()}
window.tunePanel=tunePanel;window.upgrade=upgrade;

function auctionPanel(){
let s='<div class="sub">Аукцион использует игровую валюту. Лоты обновляются локально; ставки не являются реальными деньгами.</div>';
auctionCars.forEach((q,i)=>s+=`<div class="row"><div><b>${q.name}</b><div class="small">${q.power} л.с. · текущая ставка ${moneyFmt(q.bid)}</div></div><button class="buy" onclick="bidAuction(${i})">Ставка</button></div>`);
s+='<div class="row"><div><b>Продать свою машину</b><div class="small">Моментальная продажа за 65% от базовой цены + 5% за каждый уровень тюнинга.</div></div><button class="buy" onclick="sellActive()">Продать</button></div>';
panel('🔨 Аукцион',s)
}
function bidAuction(i){let q=auctionCars[i],bid=q.bid+Math.max(50000,Math.round(q.bid*.08));if(money<bid){toast('Не хватает на ставку');return}money-=bid;cars.push({name:q.name,price:q.price,color:q.color,power:q.power,turbo:0,engine:0,brakes:0,wheels:0,paint:0,vinyl:0});activeCar=cars.length-1;q.bid=bid;addXP(100);toast('Вы выиграли лот: '+q.name);auctionPanel()}
function sellActive(){if(cars.length<=1){toast('Нельзя продать последнюю машину');return}let q=cars[activeCar],levels=q.turbo+q.engine+q.brakes+q.wheels+q.paint+q.vinyl;let val=q.price*.65*(1+levels*.05);money+=val;cars.splice(activeCar,1);activeCar=Math.max(0,activeCar-1);updateHud();toast('Продано за '+moneyFmt(val));auctionPanel()}
window.auctionPanel=auctionPanel;window.bidAuction=bidAuction;window.sellActive=sellActive;

function slots(){
let syms=['🍒','🍋','🔔','💎','7️⃣','⭐'],a=syms[Math.floor(Math.random()*6)],b=syms[Math.floor(Math.random()*6)],d=syms[Math.floor(Math.random()*6)];
let bet=100,win=0;if(a===b&&b===d)win=bet*20;else if(a===b||b===d||a===d)win=bet*2;chips-=bet+0;if(win)chips+=bet+win;return `${a} ${b} ${d} · ${win?'Выигрыш +'+win:'Пусто'}`}
function roulette(){
let bet=100;if(chips<bet){toast('Не хватает фишек');return}chips-=bet;let n=Math.floor(Math.random()*37);let win=(n===0?bet*35:(n%2===0?bet*2:0));if(win)chips+=win;return `Выпало ${n}. ${win?'Выигрыш +'+win:'Проигрыш -'+bet}`
}
function blackjack(){
let bet=100;if(chips<bet){toast('Не хватает фишек');return}chips-=bet;let a=2+Math.floor(Math.random()*10),b=2+Math.floor(Math.random()*10),dealer=2+Math.floor(Math.random()*10),sum=a+b;
if(sum>21)return `Перебор: ${sum}. -${bet}`;

function roundedRect(x,y,w,h,r){
  r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();
}
function drawRoads(){
  // ground
  ctx.fillStyle='#17231d';ctx.fillRect(0,0,world.w,world.h);
  // grass/parks
  for(let i=0;i<28;i++){
    let x=90+(i*373)%4700,y=90+(i*521)%3300;
    ctx.fillStyle=i%2?'#1d5034':'#245b3b';roundedRect(x,y,250,170,24);
    for(let t=0;t<7;t++){
      ctx.fillStyle='#34764b';ctx.beginPath();ctx.arc(x+24+t*32,y+34+(t%2)*52,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#6b9b61';ctx.beginPath();ctx.arc(x+24+t*32,y+29+(t%2)*52,6,0,Math.PI*2);ctx.fill();
    }
  }
  // roads + sidewalks
  roads.forEach(r=>{
    ctx.fillStyle='#11161a';
    if(r.vert)ctx.fillRect(r.x-108,0,216,world.h);else ctx.fillRect(0,r.y-108,world.w,216);
    ctx.fillStyle='#343b41';
    if(r.vert)ctx.fillRect(r.x-88,0,176,world.h);else ctx.fillRect(0,r.y-88,world.w,176);
    ctx.fillStyle='#596066';
    if(r.vert){ctx.fillRect(r.x-96,0,7,world.h);ctx.fillRect(r.x+89,0,7,world.h)}
    else {ctx.fillRect(0,r.y-96,world.w,7);ctx.fillRect(0,r.y+89,world.w,7)}
  });
  ctx.strokeStyle='#d9c36a';ctx.lineWidth=3;ctx.setLineDash([26,24]);
  roads.forEach(r=>{ctx.beginPath();if(r.vert){ctx.moveTo(r.x,0);ctx.lineTo(r.x,world.h)}else{ctx.moveTo(0,r.y);ctx.lineTo(world.w,r.y)}ctx.stroke()});
  ctx.setLineDash([]);
}
function drawBuildings(){
buildings.forEach((b,i)=>{ctx.fillStyle=i%3===0?'#202a32':i%3===1?'#27313a':'#1c262d';roundedRect(b.x,b.y,b.w,b.h,18);ctx.fillStyle='#111820';roundedRect(b.x+14,b.y+14,b.w-28,b.h-28,14);
for(let xx=b.x+32;xx<b.x+b.w-25;xx+=48)for(let yy=b.y+32;yy<b.y+b.h-25;yy+=42){ctx.fillStyle=(xx+yy)%3===0?'#89a1ad':'#4b6570';ctx.fillRect(xx,yy,17,10)}
ctx.fillStyle='#d0b35a';ctx.fillRect(b.x+b.w/2-15,b.y+b.h-16,30,5)})
}
function drawTraffic(){
traffic.forEach(t=>{t.x+=Math.cos(t.a)*t.s;t.y+=Math.sin(t.a)*t.s;if(t.x<50||t.x>4950)t.a=Math.PI-t.a;if(t.y<50||t.y>3550)t.a=-t.a;ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);ctx.fillStyle=t.color;roundedRect(-15,-7,30,14,4);ctx.fillStyle='#9fb5c0';ctx.fillRect(-6,-5,12,10);ctx.restore()})
}

function handleCommand(raw){
 let a=raw.slice(1).split(/\s+/),cmd=(a.shift()||'').toLowerCase();
 if(cmd==='help'){commandHelp();return}
 if(cmd==='admin'){if(isAdmin())adminPanel();else chatLine('Нет доступа.','sys');return}
 if(!isAdmin()){chatLine('Недостаточно прав.','sys');return}

 if(cmd==='mute'){let m=Math.min(120,amount(a[0])||10);mutedUntil=Date.now()+m*60000;chatLine('Система: мут на '+m+' мин.','sys')}
 else if(cmd==='unmute'){mutedUntil=0;chatLine('Система: мут снят.','sys')}
 else if(cmd==='kick')chatLine('Система: игрок исключён (демо).','sys');
 else if(cmd==='ban'){let m=Math.min(1440,amount(a[0])||30);chatLine('Система: бан на '+m+' мин. (демо).','sys')}
 else if(cmd==='warn')chatLine('Система: предупреждение выдано.','sys');
 else if(cmd==='givemoney'){let n=amount(a[0]);money+=n;updateHud();chatLine('ADMIN: +'+moneyFmt(n),'admin')}
 else if(cmd==='givechips'){let n=amount(a[0]);chips+=n;updateHud();chatLine('ADMIN: +'+numFmt(n)+' фишек','admin')}
 else if(cmd==='donate'){let n=amount(a[0]);localStorage.setItem('clrp_donate',String((+localStorage.getItem('clrp_donate')||0)+n));toast('Донат +'+n);chatLine('ADMIN: донат +'+n,'admin')}
 else if(cmd==='setlevel'){let n=Math.max(1,Math.min(100,amount(a[0])||1));level=n;xp=0;updateHud();chatLine('ADMIN: уровень '+n,'admin')}
 else if(cmd==='players')chatLine('Игроки онлайн: Owner, Alex, Max, Nikita (демо)','sys');
 else chatLine('Неизвестная команда. /help','sys')
}

/* Safari fallback controller */
(function(){
  const marker=document.getElementById('playerMarker');
  const joyEl=document.getElementById('joy');
  const stick=document.getElementById('stick');
  let fx=.5,fy=.5,active=false,jx=0,jy=0;
  function sync(){
    try{
      if(typeof p!=='undefined'){
        fx=Math.max(.05,Math.min(.95,p.x/(typeof world!=='undefined'?world.w:5000)));
        fy=Math.max(.08,Math.min(.92,p.y/(typeof world!=='undefined'?world.h:3600)));
      }
    }catch(e){}
    marker.style.left=(fx*100)+'%'; marker.style.top=(fy*100)+'%';
  }
  function jm(e){
    const r=joyEl.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
    const len=Math.hypot(x,y),m=Math.min(40,len),a=Math.atan2(y,x);
    jx=Math.cos(a)*m/40;jy=Math.sin(a)*m/40;
    stick.style.left=(32+jx*25)+'px';stick.style.top=(32+jy*25)+'px';
  }
  joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);jm(e)});
  joyEl.addEventListener('pointermove',e=>{if(active)jm(e)});
  function stop(){active=false;jx=jy=0;stick.style.left='32px';stick.style.top='32px'}
  joyEl.addEventListener('pointerup',stop);joyEl.addEventListener('pointercancel',stop);
  function tick(){
    try{
      if(typeof p!=='undefined' && (jx||jy)){
        if(typeof joy!=='undefined'){ /* original controller handles movement */ }
        else { p.x=Math.max(30,Math.min((typeof world!=='undefined'?world.w:5000)-30,p.x+jx*2.7)); p.y=Math.max(30,Math.min((typeof world!=='undefined'?world.h:3600)-30,p.y+jy*2.7)); }
      }
    }catch(e){}
    sync();requestAnimationFrame(tick);
  }
  sync();tick();
})();
